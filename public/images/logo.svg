<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="pinkGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E6007E" />
      <stop offset="100%" stop-color="#FF4081" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9100" />
      <stop offset="100%" stop-color="#FF6D00" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0288D1" />
      <stop offset="100%" stop-color="#00B0FF" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4CAF50" />
      <stop offset="100%" stop-color="#81C784" />
    </linearGradient>
    
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g transform="translate(0, 10)" filter="url(#dropShadow)">
    <!-- Top Pink Circle (Parent Head) -->
    <circle cx="256" cy="78" r="23" fill="url(#pinkGrad)" />

    <!-- Top Orange Circle (Child Head) -->
    <circle cx="180" cy="148" r="20" fill="url(#orangeGrad)" />

    <!-- Pink Parent Embracing Body Shape -->
    <path d="M 256,108 C 295,108 326,142 326,182 C 326,220 290,248 230,285 C 205,300 170,318 150,332 C 185,295 240,250 252,210 C 262,175 240,140 200,165 C 230,135 256,108 256,108 Z" fill="url(#pinkGrad)" />

    <!-- Orange Child Figure Shape -->
    <path d="M 178,174 C 196,174 212,192 210,215 C 208,245 186,275 160,320 C 152,335 145,355 142,375 C 135,325 140,280 152,242 C 160,215 162,174 178,174 Z" fill="url(#orangeGrad)" />

    <!-- Blue Caring Hand / Wave -->
    <path d="M 288,250 C 310,280 300,320 270,355 C 240,390 205,405 188,412 C 215,380 248,340 254,302 C 260,270 245,248 210,245 C 245,225 272,228 288,250 Z" fill="url(#blueGrad)" />

    <!-- Green Leaf Arc Accent -->
    <path d="M 315,260 C 330,295 328,340 292,388 C 265,424 235,438 235,438 C 265,420 302,385 318,345 C 332,310 325,278 315,260 Z" fill="url(#greenGrad)" />
  </g>

  <!-- Subtitle Text -->
  <text x="250" y="415" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="700" font-size="21" fill="#0D47A1" text-anchor="middle" letter-spacing="0.5">
    Taman Penitipan Anak (TPA)
  </text>

  <!-- ROBBANI Text with Distinct Color Gradient styling -->
  <g transform="translate(45, 475)">
    <text font-family="'Fredoka', 'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="62" letter-spacing="3">
      <tspan fill="#E6007E">R</tspan>
      <tspan fill="#8E24AA">O</tspan>
      <tspan fill="#5E35B1">B</tspan>
      <tspan fill="#3949AB">B</tspan>
      <tspan fill="#1E88E5">A</tspan>
      <tspan fill="#039BE5">N</tspan>
      <tspan fill="#00ACC1">I</tspan>
    </text>
  </g>
</svg>
